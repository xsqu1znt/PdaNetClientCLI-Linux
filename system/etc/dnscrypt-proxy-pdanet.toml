server_names = ['pdanet-cloudflare']
listen_addresses = ['127.0.0.1:5300', '[::1]:5300']
max_clients = 250

ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = false
doh_servers = true
odoh_servers = false

force_tcp = true
http3 = false
http_proxy = 'http://192.168.49.1:8000'
timeout = 5000
keepalive = 30
ignore_system_dns = true
netprobe_timeout = 0

cache = true
cache_size = 4096
cache_min_ttl = 60
cache_max_ttl = 86400

log_level = 2

[static.'pdanet-cloudflare']
stamp = 'sdns://AgcAAAAAAAAAAAASY2xvdWRmbGFyZS1kbnMuY29tCi9kbnMtcXVlcnk'
