server_names = ['pdanet-usb-cloudflare']
listen_addresses = ['127.0.0.1:5300', '[::1]:5300']
max_clients = 250

ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = false
doh_servers = true
odoh_servers = false

force_tcp = true
http3 = false
timeout = 5000
keepalive = 30
ignore_system_dns = true
netprobe_timeout = 0

cache = true
cache_size = 4096
cache_min_ttl = 60
cache_max_ttl = 86400

log_level = 2

[static.'pdanet-usb-cloudflare']
stamp = 'sdns://AgcAAAAAAAAABzEuMS4xLjEAEmNsb3VkZmxhcmUtZG5zLmNvbQovZG5zLXF1ZXJ5'
